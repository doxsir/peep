name: build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cmake build
        run: |
          cmake -B build
          cmake --build build
      - name: smoke - not an MZ file
        run: |
          out=$(./build/peep README.md) || true
          echo "$out" | grep -q "not an MZ"
      - name: smoke - missing file
        run: |
          out=$(./build/peep nope.exe) || true
          echo "$out" | grep -q "can't open"
